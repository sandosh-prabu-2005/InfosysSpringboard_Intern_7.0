spring.application.name=procurement

spring.datasource.url=jdbc:mysql://localhost:3306/procurement_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=sandy
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Allow circular dependencies (sometimes needed for security configs)
spring.main.allow-circular-references=true
